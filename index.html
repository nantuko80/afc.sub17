<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AFC SUB17</title>
  <meta name="description" content="Calendário não oficial dos jogos das equipas Sub-17 A e B do Anadia FC, época 2026/27.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b2a5b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08203f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/icones/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icones/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="AFC SUB17">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/saira-latin-800-italic-condensado.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <img class="topo-logo" src="assets/icones/escudo.svg" alt="" width="66" height="96">
      <div>
        <h1>AFC SUB17</h1>
        <p class="subtitulo" id="subtitulo">Calendário de jogos 2026/27</p>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <section aria-labelledby="t-proximos" class="bloco" id="sec-proximos">
      <h2 id="t-proximos" class="titulo-bloco titulo-discreto">Próximos jogos</h2>
      <div class="proximos" id="proximos" aria-busy="true">
        <div class="cartao esqueleto" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="cartao esqueleto" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      </div>
    </section>

    <section aria-labelledby="t-calendario" class="bloco" id="sec-calendario">
      <!-- Título e filtros na mesma linha (filtros à direita), fixos no topo ao fazer scroll. -->
      <div class="cal-cab">
      <h2 id="t-calendario" class="titulo-bloco">Calendário</h2>
      <div class="barra" id="barra">
        <div class="filtros">
          <div class="segmentos" role="radiogroup" aria-label="Equipa">
            <button type="button" role="radio" data-equipa="todas" aria-checked="true">Ambas</button>
            <button type="button" role="radio" data-equipa="A" aria-checked="false" aria-label="Sub-17 A">S17·A</button>
            <button type="button" role="radio" data-equipa="B" aria-checked="false" aria-label="Sub-17 B">S17·B</button>
          </div>
          <div class="segmentos seg-vista" role="radiogroup" aria-label="Jogos a mostrar">
            <button type="button" role="radio" data-vista="proximos" aria-checked="true">Próximos</button>
            <button type="button" role="radio" data-vista="resultados" aria-checked="false">Resultados</button>
          </div>
        </div>
      </div>
      </div>
      <div id="avisos"></div>
      <div id="lista" class="lista"></div>
    </section>

    <section aria-labelledby="t-subscrever" class="bloco">
      <h2 id="t-subscrever" class="titulo-bloco">Calendário no telemóvel</h2>
      <div class="cartao painel-subscricao">
        <p class="texto">Subscreva e os jogos aparecem no calendário do telemóvel, sempre atualizados.</p>
        <p class="aviso" id="subscricao-alvo"></p>
        <div class="subscricao-btns" id="subscricao-btns"></div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>Página não oficial, feita pelos diretores para organização interna.</p>
    <p id="fonte"></p>
  </footer>

  <!-- Barra de navegação tipo app, só em ecrãs estreitos (no computador fica o seletor Próximos | Resultados da lista). -->
  <nav class="navbar" aria-label="Secções" data-ativo="0">
    <span class="nav-ind" aria-hidden="true"></span>
    <a href="#sec-proximos" data-nav="proximos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="forma" vector-effect="non-scaling-stroke" d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M12 7l4.76 3.45l-1.76 5.55h-6l-1.76 -5.55l4.76 -3.45"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M12 7v-4m3 13l2.5 3m-.74 -8.55l3.74 -1.45m-11.44 7.05l-2.56 2.95m.74 -8.55l-3.74 -1.45"/></svg><span>Próximos</span></a>
    <a href="#sec-calendario" data-nav="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="forma" vector-effect="non-scaling-stroke" d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"/><path vector-effect="non-scaling-stroke" d="M16 3v4"/><path vector-effect="non-scaling-stroke" d="M8 3v4"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M4 11h16"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M11 15h1"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M12 15v3"/></svg><span>Calendário</span></a>
    <a href="#sec-calendario" data-nav="resultados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="forma" vector-effect="non-scaling-stroke" d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M12 5v2"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M12 10v1"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M12 14v1"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M12 18v1"/><path vector-effect="non-scaling-stroke" d="M7 3v2"/><path vector-effect="non-scaling-stroke" d="M17 3v2"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M15 10.5v3a1.5 1.5 0 0 0 3 0v-3a1.5 1.5 0 0 0 -3 0"/><path class="detalhe" vector-effect="non-scaling-stroke" d="M6 9h1.5a1.5 1.5 0 0 1 0 3h-.5h.5a1.5 1.5 0 0 1 0 3h-1.5"/></svg><span>Resultados</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
