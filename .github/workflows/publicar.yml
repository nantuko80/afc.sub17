name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar jogos.json
        run: node -e "const d=require('./data/jogos.json'); if(!Array.isArray(d.jogos)||!d.jogos.length) throw new Error('jogos.json sem jogos'); console.log(d.jogos.length+' jogos')"

      - name: Gerar calendários .ics
        run: node scripts/gerar-ics.mjs

      - name: Preparar site
        run: |
          mkdir _site
          cp -r index.html assets data calendario _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
